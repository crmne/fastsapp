[package]
name = "fastsapp"
version = "0.1.6"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "A fast, lightweight, native WhatsApp client built with Rust and egui"
repository = "https://github.com/crmne/fastsapp"
keywords = ["whatsapp", "chat", "egui", "messaging"]
categories = ["gui"]

[lib]
name = "fastsapp"
path = "src/lib.rs"

[[bin]]
name = "fastsapp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
directories = "6"
# The whole UI. glow keeps the binary and the dependency tree small; wgpu is
# not needed for a 2D chat client.
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "links", "wayland", "x11", "persistence"] }
egui = "0.36"
egui_extras = { version = "0.36", features = ["file", "image", "svg", "webp", "gif"] }
# Reading what a system font covers, so the app can borrow a face for a script
# Inter cannot draw. skrifa is the parser epaint already rasterizes with, and
# the version has to track epaint's or the binary compiles two copies of it;
# memmap2 keeps the probe to the few pages of each font that answer the
# question.
skrifa = "0.44"
memmap2 = "0.9"
# Decoding received pictures and stickers; WhatsApp sends JPEG, PNG, WebP.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
# The WhatsApp Web protocol: pairing, Signal encryption, history sync, media.
# Pinned to a commit rather than the crates.io release: 0.7.0 on crates.io
# turns on a `simd` feature by default whose `portable_simd` needs a nightly
# compiler, while this commit has dropped it and builds on stable. The
# default features bring the Tokio WebSocket transport, the ureq HTTP client
# for media, and the SQLite device store; `signal` (Ctrl+C handling) is left
# out because the window owns shutdown.
whatsapp-rust = { git = "https://github.com/oxidezap/whatsapp-rust", rev = "1ace865716726daec8d0f00335453fcb8de35d1b", default-features = false, features = ["sqlite-storage", "tokio-transport", "tokio-runtime", "ureq-client", "tokio-native"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
# The message archive. WhatsApp replays history once, when the device is
# linked, so the app keeps its own copy. `bundled` compiles the same SQLite
# the device store already links, so nothing new is built.
rusqlite = { version = "0.40", features = ["bundled"] }
qrcode = { version = "0.14", default-features = false }
# Fetching profile pictures from the URL WhatsApp hands out. The same crate
# and TLS stack the library's media client already links, so nothing new is
# compiled.
ureq = { version = "3", default-features = false, features = ["rustls"] }
jiff = "0.2"
# Grapheme clusters, so a flag or a family emoji is one unit; already in
# the tree through egui.
unicode-segmentation = "1"
# Opening a downloaded attachment with whatever the desktop uses for it.
open = "5"
# Sending: the file picker, images on the clipboard (already linked by
# egui-winit for text), and the MIME type of a chosen file (already linked
# by egui_extras).
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
arboard = { version = "3", default-features = false, features = ["image-data", "wayland-data-control"] }
mime_guess2 = "2"
# Names, groups, and shortcodes of every emoji, for the picker's search.
emojis = "0.9"

[features]
# Sample data and screenshot flags; never part of a release build.
demo = []

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# Signal decryption and immediate-mode layout are too slow at opt-level 0 to
# audition the app in development. Keep every dependency optimized while the
# application crate itself stays incremental.
[profile.dev.package."*"]
opt-level = 2
