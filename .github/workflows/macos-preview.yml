# Unsigned macOS preview app for manual RTL verification.
# Not a release: ad-hoc signed, demo feature on so `--demo` shows Hebrew sample.
name: macOS preview

on:
  workflow_dispatch:
  push:
    branches: [cursor/fix-rtl-word-order-e0a3]

permissions:
  contents: read

concurrency:
  group: macos-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: ZapFast.app
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-preview
      - name: Release binary
        run: cargo build --locked --release --features demo
      - name: App bundle
        env:
          PREVIEW_README: |
            ZapFast RTL preview (ad-hoc signed, not a release).

            Quick check without linking WhatsApp:
              open ZapFast.app --args --demo
            Then open the chat named Yael. The incoming line should read
            הכלב הגדול קפץ (not קפץ הגדול הכלב).

            If Gatekeeper blocks it: right-click the app, choose Open, confirm.
            Or: xattr -cr ZapFast.app && open ZapFast.app --args --demo

            Built with the demo feature; omit --demo to use a real linked session.
        run: |
          mkdir -p dist
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)-rtl-preview"
          bash packaging/macos/bundle.sh \
            target/release/zapfast \
            dist/ZapFast.app \
            "$version"
          printf '%s' "$PREVIEW_README" > dist/README.txt
          ditto -c -k --keepParent dist/ZapFast.app dist/ZapFast-rtl-preview-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ZapFast-rtl-preview-macos
          path: |
            dist/ZapFast-rtl-preview-macos.zip
            dist/README.txt
          if-no-files-found: error
