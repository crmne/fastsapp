# Ad-hoc signed Release app for manual checks. Not a GitHub Release.
name: macOS Release zip

on:
  workflow_dispatch:
  push:
    branches: [cursor/fix-rtl-word-order-e0a3]

permissions:
  contents: read

concurrency:
  group: macos-release-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CODE_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-release-zip
      - name: Release binary
        run: cargo build --locked --release
      - name: Package ZapFast.zip
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          bash packaging/macos/bundle.sh target/release/zapfast ZapFast.app "$version"
          ditto -c -k --keepParent ZapFast.app ZapFast.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ZapFast
          path: ZapFast.zip
          if-no-files-found: error
